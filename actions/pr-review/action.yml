name: 'PR auto-review'
description: >-
  Runs the shared PR auto-review engine against one pull request: LLM review,
  optional auto-fix, quality gates via the consumer's .cicd/quality-gates.sh, CI
  wait, and (for allowlisted authors) merge.
inputs:
  pr-number:      { description: 'PR number to review',                  required: true }
  pr-head-ref:    { description: 'PR head branch',                       required: true }
  pr-base-ref:    { description: 'PR base branch',                       required: true }
  pr-title:       { description: 'PR title',                             required: false, default: '' }
  pr-body:        { description: 'PR body',                              required: false, default: '' }
  pr-author:      { description: 'PR author login',                      required: true }
  pr-html-url:    { description: 'PR URL',                               required: false, default: '' }
  head-sha:       { description: 'PR head SHA',                          required: true }
  base-sha:       { description: 'PR base SHA',                          required: true }
  repo:           { description: 'owner/repo',                           required: true }
  work-dir:       { description: 'Checkout directory for the PR branch', required: true }
  github-token:   { description: 'GITHUB_TOKEN',                         required: true }
  openrouter-api-key:
    description: >-
      OpenRouter key. May be EMPTY: a Dependabot-triggered run receives no Actions
      secrets, and the engine reports that as a clean skip rather than a failed
      review — a bot that could not review must not present as one that reviewed
      and found the PR wanting.
    required: false
    default: ''
  openrouter-model:          { description: 'Primary model id',   required: false, default: '' }
  openrouter-fallback-model: { description: 'Fallback model id',  required: false, default: '' }
  automerge-authors:
    description: >-
      Comma-separated logins whose PRs get auto-fix pushes and auto-merge.
      Everyone else gets a comment-only review. EMPTY MEANS MERGE NOBODY, which is
      the safe default and what a shadow-mode rollout should pass.
    required: false
    default: ''
  strict-skipped:
    description: >-
      Treat ANY skipped check as unresolved, not just a skipped REQUIRED one.
      THE RULE IS NOT "set it when the repo has no aggregate gate job" — an
      earlier version of this text said that, and following it would hang
      PromptCI's reviewer on every PR. Strict mode is safe only when NO check in
      the repo ever legitimately skips, so the question to ask is whether any
      workflow that publishes a check has a job-level `if:`. PromptCI's
      auto-merge.yml does, and reports SKIPPED on every human-authored PR, so
      strict mode would make the reviewer wait out its whole poll budget every
      time for a check already in its final state. Non-strict is then safe
      precisely when the REQUIRED context itself cannot skip — a job with no
      job-level `if:`, or an aggregate gate carrying `if: always()`. Verify that
      before choosing, because a skipped required check counts as PASSING to
      GitHub, and the gate stops gating with nothing to show for it. Note also
      that required_contexts() FAILS OPEN, so a wrong or empty required set has
      the same effect on its own. DEFAULTS TO EMPTY, not 'false': the config
      loader treats a set name as "the caller passed it explicitly, so it wins",
      and a non-empty default would make CICD_STRICT_SKIPPED in
      .cicd/config.env permanently dead. The engine supplies the real default.
    required: false
    default: ''
  dry-run:
    description: >-
      Review and comment, but never push a fix or merge. Use for shadow-mode
      rollout alongside an incumbent reviewer.
    required: false
    default: 'false'
  config-file:
    description: 'Per-repo config sourced before the engine runs.'
    required: false
    default: '.cicd/config.env'
outputs:
  result:
    description: 'Engine verdict (reviewed | commented | merged | blocked | skipped_dependabot | no_llm_credentials | …)'
    value: ${{ steps.review.outputs.result }}
  comment-path:
    description: 'Path to the rendered PR comment.'
    value: ${{ steps.review.outputs.comment_path }}
runs:
  using: composite
  steps:
    # The engine runs from THIS action's checkout, never from the PR's. A PR must
    # not be able to edit the reviewer that decides whether it merges. The one
    # deliberate exception is .cicd/quality-gates.sh, which the engine reads from
    # WORK_DIR (the PR head) because it IS product code and a PR that changes the
    # build must be reviewable as part of that PR.
    - name: Run PR auto-review
      id: review
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_HEAD_REF: ${{ inputs.pr-head-ref }}
        PR_BASE_REF: ${{ inputs.pr-base-ref }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        PR_AUTHOR: ${{ inputs.pr-author }}
        PR_HTML_URL: ${{ inputs.pr-html-url }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        REPO: ${{ inputs.repo }}
        WORK_DIR: ${{ inputs.work-dir }}
        GH_TOKEN: ${{ inputs.github-token }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
        OPENROUTER_FALLBACK_MODEL: ${{ inputs.openrouter-fallback-model }}
        AUTOMERGE_AUTHORS: ${{ inputs.automerge-authors }}
        CICD_STRICT_SKIPPED: ${{ inputs.strict-skipped }}
        CICD_DRY_RUN: ${{ inputs.dry-run }}
        CICD_CONFIG_FILE: ${{ inputs.config-file }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Per-repo config. Read from the BASE commit, NOT the PR head.
        #
        # `.cicd/quality-gates.sh` is deliberately taken from the head — it is
        # product code, and a PR that changes how the project builds must be
        # reviewable as part of that PR. This file is the opposite case: it names
        # the required checks and the feature flags, i.e. it configures the gate
        # that decides whether this very PR merges. Reading it from the head
        # would let a PR author weaken their own merge gate — set
        # CICD_REQUIRED_CHECKS_FALLBACK to a context that does not exist and
        # required_contexts() FAILS OPEN, after which every skipped check counts
        # as a pass.
        #
        # Consequence, and it is the correct one: the PR that first ADDS
        # .cicd/config.env runs under defaults, and the file takes effect once
        # merged. That is how every other trusted-ref input here already behaves.
        config=""
        if [ -n "${BASE_SHA:-}" ]; then
          if ! git -C "$WORK_DIR" cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git -C "$WORK_DIR" fetch --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || true
          fi
          if git -C "$WORK_DIR" cat-file -e "${BASE_SHA}:${CICD_CONFIG_FILE}" 2>/dev/null; then
            config="$(git -C "$WORK_DIR" show "${BASE_SHA}:${CICD_CONFIG_FILE}")"
            echo "Loading ${CICD_CONFIG_FILE} from base ${BASE_SHA}"
          fi
        fi

        if [ -n "$config" ]; then
          # Parsed as data, never sourced: `source` on a file from another repo
          # is arbitrary execution inside the reviewer. See engine/load-cicd-config.sh
          # for what the parser accepts and why it is a tested file rather than
          # an inline pipeline.
          while IFS= read -r assignment; do
            [ -n "$assignment" ] || continue
            printf '%s\n' "$assignment" >> "$GITHUB_ENV"
            export "${assignment?}"
            echo "  ${assignment%%=*}"
          done < <(printf '%s\n' "$config" | bash "${ACTION_PATH}/../../engine/load-cicd-config.sh" -)
        else
          echo "No ${CICD_CONFIG_FILE} at the base commit — using engine defaults."
        fi

        # The engine's own review-prompt.md stays per-repo — it is product
        # knowledge, not shared machinery.
        export SYSTEM_PROMPT_FILE="${WORK_DIR}/scripts/review-prompt.md"

        bash "${ACTION_PATH}/../../engine/pr-review.sh"
