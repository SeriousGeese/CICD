name: 'Resolve gh CLI on this runner'
description: >-
  Finds a gh that actually RUNS on the runner that is executing (not merely an
  executable file) and exports it as $GH_CLI, falling back to a pinned,
  sha256-verified official release when no installed gh works. Must run before
  anything that shells out to gh.
inputs:
  hint:
    description: >-
      Preferred gh path — a HINT, not the answer. Pass `vars.GH_CLI_PATH`. A repo
      variable has ONE value repo-wide, and a pr-review fleet is heterogeneous
      (Bazzite/linuxbrew vs Ubuntu/apt), so a value that is wrong for the current
      runner must not be fatal.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Why this is not just `gh`, and why each candidate is probed rather than
    # tested with `-x`: see the header of engine/resolve-gh.sh.
    - shell: bash
      env:
        GH_CLI_HINT: ${{ inputs.hint }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH}/../../engine/resolve-gh.sh"
