name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs. A tag is a mutable pointer —
      # anyone who can push to the action's repo can move `v7` to different code
      # and every workflow referencing it picks that up silently. A SHA cannot be
      # repointed. This repo is consumed by three others, two of them private,
      # running on self-hosted runners with write tokens, so it is a supply-chain
      # concentration point and pins the things it depends on from commit one.
      # The trailing comment carries the human-readable version; the
      # github-actions entry in dependabot.yml keeps SHA and comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The engine is a 3000-line bash script that decides whether code merges,
      # and none of the three consumer repos runs shellcheck on it today.
      #
      # Gated at WARNING rather than error: the inherited file had exactly two
      # warning-level findings and both were real — a dead name in a `local`
      # list, and a `local x="$(cmd)"` whose `local` return status masks the
      # substitution's. Both were fixed, so the gate starts at the level it can
      # actually hold. A gate nobody can pass is a gate somebody disables.
      - name: Shellcheck (engine)
        run: shellcheck -S warning engine/*.sh

      - name: Test
        run: pnpm test
